<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Test network feedback</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; background: #101c2b; color: #fff; font: 17px/1.5 system-ui, sans-serif; }
    main { max-width: 480px; margin: 24px auto; }
    h1 { line-height: 1.2; }
    label { display: block; margin: 20px 0 6px; }
    select, textarea, button { width: 100%; padding: 12px; border-radius: 8px; font: inherit; }
    textarea { min-height: 110px; }
    button { margin-top: 24px; border: 0; background: #69f0c7; color: #101c2b; font-weight: bold; }
    small { display: block; margin-top: 20px; color: #c4d0de; }
  </style>
</head>
<body><main>
  <p>PORTALIS / LOCAL TEST</p>
  <h1>Test network feedback</h1>
  <p>You connected to the <strong>test</strong> Wi-Fi network. This is a local test, not an internet or account sign-in.</p>
  <form method="post" action="/confirm">
    <label for="rating">How well did the connection work?</label>
    <select id="rating" name="rating" required>
      <option value="">Choose a rating</option>
      <option value="5">Very well</option>
      <option value="3">Some problems</option>
      <option value="1">Did not work as expected</option>
    </select>
    <label for="feedback">Optional feedback</label>
    <textarea id="feedback" name="feedback" maxlength="1000" placeholder="Describe your test experience"></textarea>
    <button type="submit">Save test feedback</button>
  </form>
  <small>Your feedback is saved on this device's SD card. Do not enter passwords, account details, or other personal information.</small>
</main></body>
</html>
